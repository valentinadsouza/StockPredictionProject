<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Prediction Results</title>
    <!-- Add the following line to include Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-800 text-white font-sans">
    <div class="container mx-auto p-4">
        <h2 class="text-4xl font-bold mb-4">Results</h2>
        <p class="mb-2 text-xl" >Linear Regression MSE: {{ linear_reg_mse }}</p>
        <p class="mb-4 text-xl">Random Forest MSE: {{ random_forest_mse }}</p>

        <h3 class="text-4xl font-bold mb-2">Plots</h3>
        <div class="mb-4">
            <img src="data:image/png;base64,{{ historical_plot }}" alt="Historical Stock Prices"
                class="w-full h-auto border border-gray-700 rounded">
        </div>
        <div>
            <img src="data:image/png;base64,{{ predictions_plot }}" alt="Stock Price Predictions"
                class="w-full h-auto border border-gray-700 rounded">
        </div>
    </div>
</body>
</html>
